services:
  dash-api:
    build:
      context: ./services/dash-api
      dockerfile: Dockerfile
    container_name: dash-api
    restart: unless-stopped
    ports:
      - ${PORT:-8090}:8090
    env_file:
      - path: .env
        required: false
      - path: services/dash-api/.env
        required: false
    environment:
      PORT: 8090
      DASH_DATA_DIR: /data
    volumes:
      - dash-data:/data
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://127.0.0.1:8090/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  dash-data: